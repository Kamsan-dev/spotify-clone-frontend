<app-avatar [username]="user().firstName" [imageUrl]="user().imageUrl" (logoutClick)="authService.logout()"></app-avatar>
<div class="flex items-end space-x-7 h-80 text-white p-8" [ngClass]="'bg-gradient-to-b to-black ' + headerColor">
  @if (headerType() === 'playlist'){
  <div class="flex col items-end space-x-4">
    <div class="h-44 w-44 shadow-2xl rounded bg-red-600"></div>

    <div class="flex flex-col gap-2">
      <span class="text-2xl">Private playlist</span>
      <h1 class="text-2xl md:text-3xl xl:text-5xl font-bold">{{ playlist()?.title }}</h1>
      <span
        >{{ user().firstName }} &bull; <span class="text-gray-500"> {{ songsNumber() }} titles &bull; {{ totalDuration() | duration : true }}</span></span
      >
    </div>
  </div>
  } @else {

  <div class="flex flex-col gap-2 w-full">
    <h1 class="block mt-2 text-3xl font-extrabold">Good morning {{ user().firstName }}</h1>

    <app-playlist-card></app-playlist-card>
  </div>

  }
</div>
