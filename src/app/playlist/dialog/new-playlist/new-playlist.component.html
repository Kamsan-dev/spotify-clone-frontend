<div class="mb-3 tw">
  <h2 class="mt-0 mb-4">Provide a title to your playlist.</h2>

  <form [formGroup]="createForm" (ngSubmit)="onSubmit()">
    <input type="text" formControlName="title" class="input-full p-inputtext" placeholder="Title" />

    @if (createForm.get('title')?.invalid && createForm.get('title')?.dirty) {
    <small id="title-required" class="text-error">Title is required</small>
    } @else {
    <div class="placeholder-validation"></div>
    }
    <div class="mt-3 w-full flex justify-end">
      <button
        [disabled]="createForm.invalid || loading()"
        type="submit"
        class="bg-transparent hover:bg-green-500 text-green-700 font-semibold hover:text-white py-2 px-4 border border-green-500 hover:border-transparent rounded-full cursor-pointer"
        [class.p-disabled]="createForm.invalid || loading()"
      >
        @if (loading()) {
        <fa-icon class="mr-2" icon="circle-notch" animation="spin"></fa-icon>
        } Save song
      </button>
    </div>
  </form>
</div>
