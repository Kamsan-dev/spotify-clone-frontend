<p-menu #menu [model]="currentMenuItems" [popup]="true" styleClass="w-[300px] rounded-lg text-white p-4" appendTo="body">
  <!-- Custom content on top: header + search + new playlist button -->
  <ng-template pTemplate="start">
    <div class="mb-4">
      <div class="text-sm text-gray-200 font-semibold mb-3">Save or delete song from playlist</div>
      <!-- Dummy search input -->
      <div class="relative mb-3">
        <input
          type="text"
          placeholder="Search a playlist"
          class="w-full bg-[#595959] rounded-md py-2 pl-10 pr-3 text-sm text-white placeholder-gray-200 focus:outline-none focus:ring-2 focus:ring-green-500"
        />
        <fa-icon [icon]="'search'" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-200"></fa-icon>
      </div>
      <!-- New Playlist button -->
      <div class="flex items-center gap-2 text-white cursor-pointer px-3 py-2 rounded transition hover:bg-[#595959]">
        <fa-icon [icon]="'plus'"></fa-icon>
        <span>Create a new playlist</span>
      </div>
    </div>
  </ng-template>

  <!-- Playlist items -->
  <ng-template pTemplate="item" let-item>
    <div class="flex items-center gap-2 p-3 justify-between">
      <div class="flex items-center">
        @if (!item.likedSongs){
        <img [src]="item.image" alt="playlist cover" width="40" height="40" class="rounded mr-2" />
        } @else {
        <div class="w-10 h-10 flex rounded items-center justify-center bg-gradient-to-br from-purple-500 to-green-200 mr-2">
          <fa-icon [icon]="'heart'" class="text-white text-xl"></fa-icon>
        </div>
        }
        <span class="text-white text-sm">{{ item.label }}</span>
      </div>
      @if (isSongInPlaylist(item.publicId)){
      <fa-icon [icon]="'circle-check'" class="p-2 fa-fw green-spotify cursor-pointer"></fa-icon>
      } @else {
      <fa-icon [icon]="'circle-plus'" class="p-2 fa-fw cursor-pointer"></fa-icon>
      }
    </div>
  </ng-template>
</p-menu>

<!-- Trigger icon -->
@if (song()?.favorite){
<fa-icon [icon]="'circle-check'" class="icon fa-fw green-spotify" (click)="menu.toggle($event)"></fa-icon>
} @else {
<fa-icon [icon]="'circle-plus'" class="icon fa-fw" (click)="menu.toggle($event)"></fa-icon>
}
