<div
  class="cursor-pointer h-[75px] group flex w-full max-w-[450px] flex-grow items-center gap-4 rounded-md bg-gradient-to-r from-indigo-500 to-gray-700 shadow-md relative overflow-hidden transition-all"
>
  <div class="w-[75px] h-full flex items-center justify-center bg-gradient-to-br from-purple-500 to-green-200">
    <fa-icon [icon]="'heart'" class="text-white text-3xl"></fa-icon>
  </div>
  <div class="flex items-center h-full">
    <span class="text-white font-semibold text-xl">Liked songs</span>
  </div>

  <button
    class="absolute bottom-[15px] right-0 transform -translate-x-1/2 translate-y-full group-hover:translate-y-0 opacity-0 group-hover:opacity-100 transition-all duration-300 ease-in-out bg-green-600 hover:bg-green-400 text-black w-12 h-12 rounded-full flex items-center justify-center"
    aria-label="Play"
  >
    <fa-icon [icon]="'play'" class="text-xl"></fa-icon>
  </button>
</div>
