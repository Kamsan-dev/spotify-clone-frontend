<div class="song-card-background w-48 rounded-md">
  <div class="group relative w-full text-white rounded-lg overflow-hidden shadow hover:shadow-lg transition-shadow duration-300">
    <!-- Album Art -->
    <div class="relative">
      <img class="w-full h-40 object-cover rounded-md" [src]="'data:' + song().cover?.fileContentType + ';base64,' + song().cover?.file" alt="Song cover" />

      <!-- Play Button (hidden by default, appears on hover) -->
      <button
        class="absolute bottom-[15px] right-[-10%] transform -translate-x-1/2 translate-y-full group-hover:translate-y-0 opacity-0 group-hover:opacity-100 transition-all duration-300 ease-in-out bg-green-600 hover:bg-green-400 text-black w-12 h-12 rounded-full flex items-center justify-center"
        aria-label="Play"
      >
        <fa-icon [icon]="'play'" class="text-xl"></fa-icon>
      </button>
    </div>

    <!-- Song Info -->
    <div class="py-3">
      <p class="text-xl font-semibold">{{ song().title.value }}</p>
      <p class="text-sm text-zinc-400">{{ song().artist.value }}</p>
    </div>
  </div>
</div>
